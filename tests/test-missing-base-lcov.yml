name: Test - Missing base LCOV file (graceful ignore)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create current lcov.info but NOT the base file
        run: |
          mkdir -p coverage

          # Current coverage file exists
          cat > coverage/lcov.info << 'EOF'
          TN:
          SF:src/app.js
          FN:1,handler
          FNDA:1,handler
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,0
          LF:3
          LH:2
          BRF:0
          BRH:0
          end_of_record
          EOF

          # Ensure base file does NOT exist
          rm -f coverage/lcov-base.info

          echo "Created coverage/lcov.info, base file absent"

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          lcov-file: ./coverage/lcov.info
          lcov-base: ./coverage/lcov-base.info
        continue-on-error: true

      - name: Assert action handled missing base file gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action logs "No coverage report found at '...', ignoring..." for missing base
          # and continues with just the current lcov. It may then fail on sentinel repo context.
          # Both success and graceful failure are acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded, ignoring missing base lcov file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under workflow_dispatch with sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
