name: Test lcov-base comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create current lcov.info file
        run: |
          cat > /tmp/lcov-current.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,1
          DA:4,0
          LF:4
          LH:3
          end_of_record
          EOF

      - name: Create base lcov.info file
        run: |
          cat > /tmp/lcov-base.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,0
          DA:4,0
          LF:4
          LH:2
          end_of_record
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          lcov-file: /tmp/lcov-current.info
          lcov-base: /tmp/lcov-base.info

      - name: Assert action ran with base comparison (posts comment or fails gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with lcov-base comparison"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
