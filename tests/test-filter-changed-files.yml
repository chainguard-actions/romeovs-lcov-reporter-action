name: Test filter-changed-files and delete-old-comments options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create lcov.info fixture
        run: |
          cat > /tmp/lcov-filtered.info << 'EOF'
          TN:
          SF:src/utils.js
          FN:1,helper
          FNDA:1,helper
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,1
          LF:3
          LH:3
          BRF:2
          BRH:1
          end_of_record
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:0,main
          FNF:1
          FNH:0
          DA:1,0
          DA:2,0
          LF:2
          LH:0
          BRF:0
          BRH:0
          end_of_record
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          lcov-file: /tmp/lcov-filtered.info
          filter-changed-files: "true"
          delete-old-comments: "true"

      - name: Assert action ran (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with filter-changed-files and delete-old-comments"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or not a PR context)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
