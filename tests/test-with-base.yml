name: Test usage with lcov-base comparison
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Copy lcov fixtures into workspace
        run: |
          cp $GITHUB_WORKSPACE/actions/hardened/romeovs--lcov-reporter-action/v0.2.20/tests/fixtures/lcov.info \
             $GITHUB_WORKSPACE/lcov.info
          cp $GITHUB_WORKSPACE/actions/hardened/romeovs--lcov-reporter-action/v0.2.20/tests/fixtures/lcov-base.info \
             $GITHUB_WORKSPACE/lcov-base.info
      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: fake-token-for-testing
          lcov-file: lcov.info
          lcov-base: lcov-base.info
      - name: Assert action ran with lcov-base input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail because there is no real GitHub PR context,
          # but it must have started (not skipped), confirming all inputs were accepted.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, inputs were not accepted"
            exit 1
          fi
          echo "PASS: action ran with github-token, lcov-file, and lcov-base inputs"
