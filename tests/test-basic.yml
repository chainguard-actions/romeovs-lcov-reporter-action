name: Test basic usage with lcov-file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create lcov file
        run: |
          mkdir -p coverage
          cat > coverage/lcov.info << 'EOF'
          TN:
          SF:src/index.js
          FN:1,main
          FNDA:1,main
          FNF:1
          FNH:1
          DA:1,1
          DA:2,1
          DA:3,0
          LF:3
          LH:2
          end_of_record
          EOF

      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          lcov-file: coverage/lcov.info
        continue-on-error: true

      - name: Assert action ran with inputs
        run: |
          echo "Action completed (may fail due to fake token, but inputs were accepted)"
          echo "PASS: inputs github-token and lcov-file were provided"
